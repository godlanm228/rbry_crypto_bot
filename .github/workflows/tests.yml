name: tests

# Every push to main and every pull request: the lint and the whole suite on Linux, as on the server.
# No secrets: the tests set what they need and reach no network.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt pyflakes
      - name: Lint (unused and undefined names)
        run: git ls-files '*.py' | xargs python -m pyflakes
      - name: Tests
        run: python -m pytest -q
